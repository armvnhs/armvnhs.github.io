<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Arman Haghshenas — Graphic Designer</title>
<meta name="description" content="Arman Haghshenas, graphic designer. Projects, products and notes.">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=SN+Pro:wght@400;500;600;700;800&family=Estedad:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
<style>
  :root { --ink: #0A0A0A; --soft: #6F6F73; --fill: #F2F2F3; --navy: #22396F; --ratio: 4 / 5; --ease: cubic-bezier(.22, 1, .36, 1); }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  ::selection { background: var(--navy); color: #fff; }
  html { scroll-behavior: smooth; scrollbar-width: none; }
  ::-webkit-scrollbar { display: none; }
  body { font-family: 'SN Pro', 'Estedad', sans-serif; background: #fff; color: var(--ink); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  a { color: inherit; text-decoration: none; }
  .page { max-width: 860px; margin: 0 auto; padding: calc(64px + env(safe-area-inset-top)) 20px calc(160px + env(safe-area-inset-bottom)); }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }

  header h1 { font-size: clamp(38px, 8vw, 60px); font-weight: 800; letter-spacing: -.045em; line-height: 1; }
  header p { margin-top: 14px; max-width: 460px; font-size: 16.5px; color: var(--soft); font-weight: 500; }
  .socials { display: flex; gap: 8px; margin-top: 22px; }
  .socials a { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--fill); transition: background .25s, color .25s, transform .2s; touch-action: manipulation; }
  .socials a:active { transform: scale(.92); }
  .socials .ti { font-size: 22px; }
  @media (hover: hover) and (pointer: fine) { .socials a:hover { background: var(--navy); color: #fff; } }

  section { margin-top: 76px; scroll-margin-top: 28px; }
  section h2 { margin-bottom: 22px; font-size: clamp(24px, 4vw, 30px); font-weight: 800; letter-spacing: -.035em; line-height: 1.1; }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
  .card { position: relative; display: block; aspect-ratio: var(--ratio); border-radius: 24px; overflow: hidden; isolation: isolate; color: #fff; background: linear-gradient(160deg, #2e2e31, #0d0d0e); }
  .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .8s var(--ease); }
  .card .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-bottom: 48px; }
  .card .ph .ti { font-size: 32px; color: rgba(255,255,255,.22); }
  .card::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.74) 0%, rgba(0,0,0,.36) 28%, transparent 56%); }
  .cap { position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 14px 14px 16px; }
  .cap h3 { font-size: clamp(14px, 1.7vw, 16px); font-weight: 700; letter-spacing: -.02em; line-height: 1.25; text-align: start; }
  .cap p { margin-top: 2px; font-size: 12px; color: rgba(255,255,255,.72); line-height: 1.4; text-align: start; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  @media (hover: hover) and (pointer: fine) { .card:hover img { transform: scale(1.05); } }

  .dock { position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 50; max-width: calc(100vw - 20px); }
  .pill { display: flex; align-items: center; gap: 4px; padding: 8px 14px; background: #fff; border: 1px solid rgba(10,10,10,.06); border-radius: 36px; box-shadow: 0 10px 34px rgba(10,10,10,.1), 0 2px 6px rgba(10,10,10,.05); }
  .pill a { position: relative; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 18px; color: #55565A; transition: color .3s, transform .2s; touch-action: manipulation; }
  .pill .ti { font-size: 27px; }
  .pill a:active { transform: scale(.9); }
  .pill a.on { color: var(--navy); }
  .pill a.on::before { content: ""; position: absolute; left: 50%; bottom: 8px; width: 46px; height: 42px; transform: translateX(-50%); background: radial-gradient(ellipse at 50% 100%, rgba(34,57,111,.3), transparent 70%); pointer-events: none; }
  .pill a.on::after { content: ""; position: absolute; left: 50%; bottom: 6px; width: 30px; height: 3px; border-radius: 3px; background: var(--navy); transform: translateX(-50%); }

  @media (max-width: 900px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 600px) {
    .page { padding: calc(44px + env(safe-area-inset-top)) 16px calc(130px + env(safe-area-inset-bottom)); }
    section { margin-top: 60px; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .card { border-radius: 22px; }
    .cap { padding: 12px 12px 14px; }
    .pill { padding: 6px 10px; }
    .pill a { width: 50px; height: 52px; }
  }
</style>
</head>
<body>
<main class="page">
  <header id="home">
    <h1>Arman<br>Haghshenas</h1>
    <p>Graphic designer crafting logos, brands and visual identities.</p>
    <div class="socials">
      <a href="https://t.me/armvnpv" target="_blank" rel="noopener noreferrer" aria-label="Telegram"><i class="ti ti-brand-telegram"></i></a>
      <a href="https://instagram.com/armvnhs" target="_blank" rel="noopener noreferrer" aria-label="Instagram"><i class="ti ti-brand-instagram"></i></a>
      <a href="https://www.behance.net/armvnhs" target="_blank" rel="noopener noreferrer" aria-label="Behance"><i class="ti ti-brand-behance"></i></a>
      <a href="https://dribbble.com/armvnhs" target="_blank" rel="noopener noreferrer" aria-label="Dribbble"><i class="ti ti-brand-dribbble"></i></a>
      <a href="https://linkedin.com/in/armvnhs" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn"><i class="ti ti-brand-linkedin"></i></a>
    </div>
  </header>

  <section id="projects"><h2>Projects</h2><div class="grid" id="projectsGrid"></div></section>
  <section id="products"><h2>Products</h2><div class="grid" id="productsGrid"></div></section>
  <section id="notes"><h2>Notes</h2><div class="grid" id="notesGrid"></div></section>
</main>

<nav class="dock">
  <div class="pill" id="nav">
    <a href="#home" class="on" data-s="home" title="Home" aria-label="Home"><i class="ti ti-home"></i></a>
    <a href="#projects" data-s="projects" title="Projects" aria-label="Projects"><i class="ti ti-layout-grid"></i></a>
    <a href="#products" data-s="products" title="Products" aria-label="Products"><i class="ti ti-box"></i></a>
    <a href="#notes" data-s="notes" title="Notes" aria-label="Notes"><i class="ti ti-notebook"></i></a>
  </div>
</nav>

<script>
  const SECTIONS = ['projects', 'products', 'notes'];
  const ICONS = { projects: 'layout-grid', products: 'box', notes: 'notebook' };
  const FALLBACK = {
    projects: [{ title: 'Isfahan Core', subtitle: 'Sticker design', image: '', link: 'https://www.instagram.com/p/DZxdnAiDc7x/' }],
    products: [{ title: 'LogoSVG', subtitle: 'Open-source Iranian logo library', image: '', link: 'https://logosvg.ir' }],
    notes: [{ title: 'First note', subtitle: 'Short thoughts on design', image: '', link: '#' }]
  };

  const esc = (t) => String(t == null ? '' : t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function cardHTML(p, icon) {
    const pic = p.image
      ? '<img src="' + esc(p.image) + '" alt="' + esc(p.title) + '" loading="lazy" decoding="async">'
      : '<div class="ph"><i class="ti ti-' + icon + '"></i></div>';
    const link = p.link || '#';
    const ext = /^https?:/i.test(link) ? ' target="_blank" rel="noopener noreferrer"' : '';
    return '<a class="card" href="' + esc(link) + '"' + ext + '>' + pic + '<div class="cap"><h3 dir="auto">' + esc(p.title) + '</h3>' + (p.subtitle ? '<p dir="auto">' + esc(p.subtitle) + '</p>' : '') + '</div></a>';
  }

  function load(key) {
    return fetch('data/' + key + '.json', { cache: 'no-cache' })
      .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
      .catch(() => FALLBACK[key]);
  }

  Promise.all(SECTIONS.map(load)).then((all) => {
    SECTIONS.forEach((key, i) => {
      const items = Array.isArray(all[i]) ? all[i] : [];
      if (!items.length) {
        document.getElementById(key).remove();
        document.querySelector('#nav a[data-s="' + key + '"]').remove();
        return;
      }
      document.getElementById(key + 'Grid').innerHTML = items.map((p) => cardHTML(p, ICONS[key])).join('');
    });
    spy();
  });

  function spy() {
    const links = [...document.querySelectorAll('#nav a')];
    const set = (id) => links.forEach((a) => a.classList.toggle('on', a.dataset.s === id));
    const io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) set(e.target.id); }), { rootMargin: '-40% 0px -55% 0px', threshold: 0 });
    links.forEach((a) => { const t = document.getElementById(a.dataset.s); if (t) io.observe(t); });
    addEventListener('scroll', () => {
      if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) set(links[links.length - 1].dataset.s);
    }, { passive: true });
  }
</script>
</body>
</html>
