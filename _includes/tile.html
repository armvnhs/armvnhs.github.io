<a class="tile {{ include.cls }}" href="{{ include.href }}"{% if include.external %} target="_blank" rel="noopener"{% endif %}><span class="tile-top"><span class="tile-icon">{% include icon.html name=include.icon %}</span>{% include arrow.html %}</span><span class="tile-body"><span class="tile-label">{{ include.label }}</span><span class="tile-value">{{ include.value }}</span>{% if include.hint.size > 0 %}<span class="tile-hint">{{ include.hint }}</span>{% endif %}</span></a>
