<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note — Arman Haghshenas</title>
  <meta name="description" content="Notes by Arman Haghshenas.">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #0A0A0A; font-family: Teshrin, sans-serif; -webkit-font-smoothing: antialiased; }
    main { max-width: 760px; margin: auto; padding: 48px 24px 80px; }
    .back { display: inline-flex; align-items: center; gap: 8px; color: #2A6B5C; text-decoration: none; font-weight: 600; margin-bottom: 40px; }
    a:focus-visible { outline: 3px solid #2A6B5C; outline-offset: 5px; }
    h1 { font-size: clamp(30px, 6vw, 48px); line-height: 1.4; margin: 0; letter-spacing: -.025em; overflow-wrap: anywhere; }
    .summary { color: #6F6F73; font-size: 18px; line-height: 1.9; margin: 14px 0 28px; }
    .cover { display: block; width: 100%; max-height: 520px; object-fit: cover; border-radius: 20px; margin: 28px 0 36px; }
    .body { margin-top: 32px; font-size: 18px; line-height: 2; overflow-wrap: anywhere; }
    .body p { margin: 0 0 24px; white-space: pre-wrap; }
    .body h1, .body h2, .body h3, .body h4 { margin: 32px 0 16px; line-height: 1.6; }
    .body img { max-width: 100%; height: auto; border-radius: 16px; }
    .body a { color: #2A6B5C; text-underline-offset: 4px; }
    .body ul, .body ol { padding-inline-start: 28px; }
    .body blockquote { margin: 24px 0; padding: 12px 20px; border-inline-start: 3px solid #2A6B5C; background: #f3f7f5; }
    .body pre { overflow-x: auto; padding: 16px; background: #f2f2f3; border-radius: 12px; direction: ltr; }
    .body table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
    .body th, .body td { border: 1px solid #ddd; padding: 8px 12px; }
    .status { color: #6F6F73; line-height: 1.8; }
    [hidden] { display: none !important; }
    @media (max-width: 600px) { main { padding: 28px 20px 48px; } .back { margin-bottom: 28px; } .body { font-size: 17px; } }
  </style>
<link rel="stylesheet" href="assets/site.css">
<link rel="icon" type="image/png" href="assets/img/site/Icon.png">
</head>
<body>
  <main>
    <a class="back" href="index.html#notes"><span aria-hidden="true">←</span> Back to notes</a>
    <p id="status" class="status" role="status">Loading article…</p>
    <article id="article" hidden aria-labelledby="title">
      <h1 id="title" dir="auto"></h1>
      <p id="summary" class="summary" dir="auto" hidden></p>
      <img id="cover" class="cover" alt="" hidden>
      <div id="body" class="body" dir="auto"></div>
    </article>
  </main>
  <script src="assets/blog.js"></script>
  <script>    async function loadArticle() {
      const status = document.getElementById('status');
      const slug = new URLSearchParams(location.search).get('slug');
      if (!slug) { status.textContent = 'Article not found.'; return; }
      try {
        let response = await fetch('data/blog.json', { cache: 'no-cache' });
        if (!response.ok && ['localhost', '127.0.0.1'].includes(location.hostname)) {
          response = await fetch('data/notes.json', { cache: 'no-cache' });
        }
        if (!response.ok) throw new Error('Unable to load notes');
        const notes = await response.json();
        if (!Array.isArray(notes)) throw new Error('Invalid notes data');
        const matches = notes.filter((note) => note && typeof note.slug === 'string' && note.slug.trim() === slug);
        if (matches.length !== 1 || typeof matches[0].title !== 'string') {
          status.textContent = 'Article not found.';
          return;
        }
        location.replace(matches[0].url || '/note/' + encodeURIComponent(slug) + '/');
      } catch (error) {
        status.textContent = 'The article could not be loaded. Please try again later.';
        console.error(error);
      }
    }
    loadArticle();
  </script>
</body>
</html>
