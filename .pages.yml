media:
  - name: images
    label: Images
    input: assets/img
    output: /assets/img
  - name: files
    label: Files
    input: assets/files
    output: /assets/files
content:
  - name: profile
    label: Profile
    type: file
    path: data/site.json
    fields:
      - name: name
        label: Name
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: avatar
        label: Photo
        type: image
      - name: favicon
        label: Favicon
        type: image
      - name: status
        label: Status
        type: select
        options:
          values:
            - value: available
              label: Available
            - value: busy
              label: Busy
      - name: email
        label: Email
        type: string
      - name: telegram
        label: Telegram
        type: string
      - name: phone
        label: Phone
        type: string
      - name: formEndpoint
        label: Form endpoint
        type: string
      - name: contactText
        label: Contact text
        type: string
      - name: social
        label: Social links
        type: object
        list:
          collapsible:
            summary: "{label}"
        fields:
          - name: label
            label: Label
            type: string
          - name: url
            label: URL
            type: string
  - name: projects
    label: Projects
    type: file
    path: data/projects.json
    fields:
      - name: items
        label: Projects
        type: object
        list:
          collapsible:
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
          - name: category
            label: Category
            type: string
          - name: cover
            label: Cover
            type: image
          - name: link
            label: Link
            type: string
  - name: companies
    label: Companies
    type: collection
    path: _companies
    format: yaml-frontmatter
    view:
      fields:
        - title
      primary: title
    fields:
      - name: title
        label: Name
        type: string
      - name: order
        label: Order
        type: number
      - name: logo
        label: Logo
        type: image
      - name: body
        label: Content
        type: rich-text
  - name: products
    label: Products
    type: file
    path: data/products.json
    fields:
      - name: items
        label: Products
        type: object
        list:
          collapsible:
            summary: "{name}"
        fields:
          - name: name
            label: Name
            type: string
          - name: description
            label: Description
            type: string
          - name: logo
            label: Logo
            type: image
          - name: link
            label: Link
            type: string
  - name: software
    label: Software
    type: file
    path: data/software.json
    fields:
      - name: items
        label: Software
        type: object
        list:
          collapsible:
            summary: "{name}"
        fields:
          - name: name
            label: Name
            type: string
          - name: icon
            label: Icon
            type: image
  - name: resume
    label: Resume
    type: file
    path: data/resume.json
    fields:
      - name: summary
        label: Summary
        type: text
      - name: pdf
        label: PDF
        type: file
        options:
          media: files
      - name: experience
        label: Experience
        type: object
        list:
          collapsible:
            summary: "{company}"
        fields:
          - name: company
            label: Company
            type: string
          - name: logo
            label: Logo
            type: image
          - name: period
            label: Period
            type: string
          - name: details
            label: Details
            type: text
      - name: education
        label: Education
        type: object
        list:
          collapsible:
            summary: "{school}"
        fields:
          - name: school
            label: School
            type: string
          - name: degree
            label: Degree
            type: string
          - name: period
            label: Period
            type: string
      - name: skills
        label: Skills
        type: string
        list: true
