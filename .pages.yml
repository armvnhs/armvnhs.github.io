media:
  - name: images
    label: Images
    input: assets/img
    output: /assets/img
  - name: files
    label: Files
    input: assets/files
    output: /assets/files
content:
  - name: profile
    label: Profile
    type: file
    path: data/site.json
    fields:
      - name: name
        label: Name
        type: string
      - name: tagline
        label: Tagline
        type: string
      - name: avatar
        label: Photo
        type: image
      - name: status
        label: Status
        type: select
        options:
          values:
            - value: available
              label: Available
            - value: busy
              label: Busy
      - name: email
        label: Email
        type: string
      - name: contactText
        label: Contact text
        type: string
      - name: social
        label: Social links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: url
            label: URL
            type: string
  - name: projects
    label: Projects
    type: file
    path: data/projects.json
    fields:
      - name: items
        label: Projects
        type: object
        list: true
        fields:
          - name: title
            label: Title
            type: string
          - name: category
            label: Category
            type: string
          - name: cover
            label: Cover
            type: image
          - name: link
            label: Link
            type: string
  - name: companies
    label: Companies
    type: file
    path: data/companies.json
    fields:
      - name: items
        label: Companies
        type: object
        list: true
        fields:
          - name: name
            label: Name
            type: string
          - name: slug
            label: Slug
            type: string
          - name: logo
            label: Logo
            type: image
          - name: role
            label: Role
            type: string
          - name: period
            label: Period
            type: string
          - name: cover
            label: Cover
            type: image
          - name: summary
            label: Summary
            type: string
          - name: body
            label: Post
            type: rich-text
            options:
              format: html
  - name: resume
    label: Resume
    type: file
    path: data/resume.json
    fields:
      - name: summary
        label: Summary
        type: text
      - name: pdf
        label: PDF
        type: file
        options:
          media: files
      - name: experience
        label: Experience
        type: object
        list: true
        fields:
          - name: company
            label: Company
            type: string
          - name: role
            label: Role
            type: string
          - name: period
            label: Period
            type: string
          - name: details
            label: Details
            type: text
      - name: education
        label: Education
        type: object
        list: true
        fields:
          - name: school
            label: School
            type: string
          - name: degree
            label: Degree
            type: string
          - name: period
            label: Period
            type: string
      - name: skills
        label: Skills
        type: string
        list: true
