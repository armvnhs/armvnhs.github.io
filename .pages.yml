media:
  - name: blog
    label: Blog
    input: assets/img/blog
    output: /assets/img/blog
    rename: safe
    categories: [image]
  - name: projects
    label: Projects
    input: assets/img/Projects
    output: /assets/img/Projects
    rename: safe
    categories: [image]

content:
  - name: projects
    label: Portfolio Projects
    type: file
    path: projects.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
      - name: tag
        label: Category
        type: string
      - name: img
        label: Cover Image
        type: image
        options:
          media: projects
      - name: link
        label: Project Link
        type: string

  - name: posts
    label: Blog Posts
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{address}.md"
    fields:
      - name: title
        label: Title
        type: string
      - name: address
        label: URL Slug (English, no date)
        type: string
      - name: description
        label: Short Description
        type: text
      - name: image
        label: Cover Image
        type: image
        options:
          media: blog
      - name: body
        label: Content
        type: rich-text
        options:
          media: blog
