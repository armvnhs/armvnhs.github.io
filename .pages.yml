media:
  - name: images
    label: Images
    input: assets/img
    output: /assets/img
    rename: safe
    categories: [image]

content:
  - name: site
    label: Site settings
    type: file
    path: data/site.json
    format: json
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: initials
        label: Avatar fallback initials
        type: string
      - name: bio
        label: Introduction
        type: text
      - name: avatar
        label: Profile photo
        type: image
        options:
          media: images
      - name: pageTitle
        label: Browser title
        type: string
      - name: description
        label: Search description
        type: text
      - name: projectsTitle
        label: Projects heading
        type: string
      - name: productsTitle
        label: Products heading
        type: string
      - name: notesTitle
        label: Notes heading
        type: string
      - name: socials
        label: Social links
        type: object
        list: true
        fields:
          - name: label
            label: Accessible name
            type: string
            required: true
          - name: icon
            label: Icon
            type: select
            options:
              values: [brand-telegram, brand-instagram, brand-behance, brand-dribbble, brand-linkedin, brand-github, brand-x, mail, link]
          - name: link
            label: URL
            type: string
            required: true

  - name: projects
    label: Projects
    type: file
    path: data/projects.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: category
        label: Category
        type: string
      - name: image
        label: Cover image
        type: image
        options:
          media: images
      - name: link
        label: URL (optional)
        type: string

  - name: products
    label: Products
    type: file
    path: data/products.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: subtitle
        label: Short description
        type: text
      - name: image
        label: Cover image
        type: image
        options:
          media: images
      - name: link
        label: URL (optional)
        type: string

  - name: notes
    label: Notes
    type: file
    path: data/notes.json
    format: json
    list: true
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: subtitle
        label: Short description
        type: text
      - name: image
        label: Cover image
        type: image
        options:
          media: images
      - name: link
        label: URL (optional)
        type: string
