<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Arman Haghshenas</title>
<link rel="icon" type="image/png" href="/assets/img/Icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=SN+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; min-height: 100svh;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 8vw;
    font-family: 'SN Pro', sans-serif;
    background: #111214; color: #fff;
    -webkit-font-smoothing: antialiased;
  }
  .eyebrow {
    font-size: 13px; font-weight: 700;
    display: flex; align-items: center; gap: 10px; margin-bottom: 22px;
  }
  .eyebrow::before { content: ""; width: 24px; height: 1.5px; background: #fff; }
  h1 {
    font-size: clamp(90px, 22vw, 260px);
    font-weight: 800; letter-spacing: -6px; line-height: .9;
  }
  p { font-size: 18px; color: rgba(255,255,255,.65); font-weight: 500; margin-top: 18px; max-width: 460px; }
  .btn {
    display: inline-flex; align-items: center; margin-top: 38px; align-self: flex-start;
    font-size: 14.5px; font-weight: 700; padding: 15px 26px; border-radius: 12px;
    background: #fff; color: #111214; text-decoration: none; transition: transform .2s;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn:active { transform: scale(.97); }
</style>
</head>
<body>
  <div class="eyebrow">Page not found</div>
  <h1>404</h1>
  <p>This page doesn't exist or has been moved.</p>
  <a href="/" class="btn">Back to Home</a>
</body>
</html>
