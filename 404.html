<!doctype html>

<head>
<meta charset="utf-8">
<title>Arman Haghshenas</title>
<script>
var l = window.location;
l.replace(
  l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") + "/?/" +
  l.pathname.slice(1).split("&").join("~and~") +
  (l.search ? "&" + l.search.slice(1).split("&").join("~and~") : "") +
  l.hash
);
</script>
</head>
