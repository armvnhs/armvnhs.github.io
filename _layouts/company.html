---
layout: default
---
<a class="back" href="/">← Work</a>
{%- if page.cover.size > 0 %}
<img class="post-cover" src="{{ page.cover | uri_escape }}" alt="{{ page.title }}">
{%- endif %}
<article class="post-body">
{%- if page.logo.size > 0 %}
<img class="post-logo" src="{{ page.logo | uri_escape }}" alt="">
{%- endif %}
<p class="post-meta">{{ page.role }}{% if page.role.size > 0 and page.period.size > 0 %} · {% endif %}{{ page.period }}</p>
<h1 class="post-title">{{ page.title }}</h1>
<p class="post-lead">{{ page.summary }}</p>
<div class="prose">
{{ content }}
</div>
</article>
