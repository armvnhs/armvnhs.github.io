<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}" dir="{{ page.direction | default: 'rtl' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#111214">
<meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ site.url }}{{ page.image | default: '/assets/img/Profile.jpg' }}">
<link rel="icon" type="image/png" href="/assets/img/Icon.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=SN+Pro:wght@400;500;600;700;800&family=Estedad:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #ffffff; --ink: #111214; --ink-soft: #6B6E76; --ink-faint: #AFB2BA;
    --line: rgba(17,18,20,.12); --accent: #000000; --radius: 12px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; scrollbar-width: none; }
  ::-webkit-scrollbar { display: none; }
  body {
    font-family: 'SN Pro', 'Estedad', sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  i { font-size: 16px; line-height: 1; }
  ::selection { background: var(--accent); color: #fff; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { animation: none !important; transition: none !important; } }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 6vw; }
  .topbar { max-width: 760px; margin: 0 auto; padding: 26px 6vw; display: flex; align-items: center; justify-content: space-between; }
  .back-link { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: var(--ink-soft); transition: color .2s; }
  .back-link i { font-size: 13px; }
  [dir="rtl"] .back-link i { transform: scaleX(-1); }
  @media (hover: hover) and (pointer: fine) { .back-link:hover { color: var(--ink); } }

  .eyebrow { font-size: 13px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .eyebrow::before { content: ""; width: 24px; height: 1.5px; background: var(--accent); }

  .page-head { padding: 20px 0 36px; }
  .page-head h1 { font-size: clamp(30px, 5vw, 48px); font-weight: 800; letter-spacing: -.5px; line-height: 1.3; }
  .page-head p { margin-top: 14px; font-size: 16px; color: var(--ink-soft); font-weight: 500; }

  .cover { width: 100%; border-radius: var(--radius); display: block; margin-bottom: 40px; background: #F4F4F5; }

  .wrap.wide, .topbar.wide { max-width: 1100px; }

  /* Post grid */
  .post-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 22px; }
  .post-card {
    position: relative; display: block; aspect-ratio: 4 / 5; border-radius: var(--radius);
    overflow: hidden; background: linear-gradient(135deg, #111214, #2b2d33); color: #fff;
  }
  .post-card img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .7s var(--ease); }
  .post-card .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
  .post-card .ph i { font-size: 64px; color: rgba(255,255,255,.1); }
  .post-card::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(0,0,0,.8) 0%, rgba(0,0,0,.12) 50%, rgba(0,0,0,0) 70%);
  }
  .post-card .info {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 2; padding: 20px;
    display: flex; justify-content: space-between; align-items: flex-end; gap: 10px;
  }
  .post-card .meta { font-size: 11.5px; font-weight: 700; color: rgba(255,255,255,.72); line-height: 1.8; }
  .post-card h2 { font-size: 16px; font-weight: 700; line-height: 1.7; }
  .post-card .go {
    flex-shrink: 0; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,.45);
    display: flex; align-items: center; justify-content: center; transition: background .3s, color .3s, transform .3s;
  }
  .post-card .go i { font-size: 13px; }
  [dir="rtl"] .post-card .go i { transform: scaleX(-1); }
  @media (hover: hover) and (pointer: fine) {
    .post-card:hover img { transform: scale(1.08); }
    .post-card:hover .go { background: #fff; color: #000; transform: rotate(40deg); }
  }

  /* Article body */
  .prose { font-size: 16.5px; }
  .prose > * + * { margin-top: 1.3em; }
  .prose h2 { font-size: 26px; font-weight: 800; line-height: 1.5; margin-top: 2em; }
  .prose h3 { font-size: 20px; font-weight: 700; line-height: 1.5; margin-top: 1.8em; }
  .prose a { font-weight: 700; border-bottom: 1.5px solid var(--ink); }
  .prose img { max-width: 100%; border-radius: var(--radius); display: block; margin: 2em auto; }
  .prose blockquote { border-right: 3px solid var(--ink); padding: 4px 20px 4px 0; color: var(--ink-soft); font-weight: 500; }
  [dir="ltr"] .prose blockquote { border-right: 0; border-left: 3px solid var(--ink); padding: 4px 0 4px 20px; }
  .prose ul, .prose ol { padding-inline-start: 1.4em; }
  .prose li + li { margin-top: .4em; }
  .prose hr { border: 0; height: 1px; background: var(--line); margin: 2.4em 0; }
  .prose code { font-family: ui-monospace, Menlo, monospace; font-size: .88em; background: #F4F4F5; padding: 2px 7px; border-radius: 6px; direction: ltr; unicode-bidi: embed; }
  .prose pre { background: var(--ink); color: #fff; padding: 20px; border-radius: var(--radius); overflow-x: auto; direction: ltr; text-align: left; }
  .prose pre code { background: none; padding: 0; color: inherit; }

  .post-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 70px 0 100px; }
  .post-nav a {
    border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px;
    font-size: 14px; font-weight: 700; transition: border-color .2s;
  }
  .post-nav small { display: block; font-size: 12px; font-weight: 600; color: var(--ink-faint); margin-bottom: 4px; }
  .post-nav .next { text-align: start; }
  .post-nav .prev { grid-column: 2; text-align: end; }
  @media (hover: hover) and (pointer: fine) { .post-nav a:hover { border-color: var(--ink); } }
  .empty { padding: 40px 0 100px; color: var(--ink-soft); }
  .list-end { height: 100px; }

  @media (max-width: 1000px) { .post-grid { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 760px) { .post-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; } .post-card .info { padding: 14px; } .post-card h2 { font-size: 14px; } }
  @media (max-width: 400px) { .post-grid { grid-template-columns: 1fr; } }

  @media (max-width: 620px) { .post-nav { grid-template-columns: 1fr; } .post-nav .prev { grid-column: 1; } }
</style>
</head>
<body>

<div class="topbar{% if page.wide %} wide{% endif %}">
  <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> بازگشت به پرتفولیو</a>
  {% if page.layout == 'post' %}<a href="/blog/" class="back-link">همهٔ مطالب</a>{% endif %}
</div>

{{ content }}

</body>
</html>
