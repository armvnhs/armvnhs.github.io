<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang }}" dir="{{ page.direction | default: 'rtl' }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<meta name="theme-color" content="#111214">
<meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ site.url }}{{ page.image | default: '/assets/img/Profile.jpg' }}">
<link rel="icon" type="image/png" href="/assets/img/Icon.png">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=SN+Pro:wght@400;500;600;700;800&family=Estedad:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #ffffff; --ink: #111214; --ink-soft: #6B6E76; --ink-faint: #AFB2BA;
    --line: rgba(17,18,20,.12); --accent: #000000; --radius: 12px;
    --ease: cubic-bezier(0.22, 1, 0.36, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; scrollbar-width: none; }
  ::-webkit-scrollbar { display: none; }
  body {
    font-family: 'SN Pro', 'Estedad', sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  i { font-size: 16px; line-height: 1; }
  ::selection { background: var(--accent); color: #fff; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { animation: none !important; transition: none !important; } }

  .wrap { max-width: 760px; margin: 0 auto; padding: 0 clamp(20px, 5vw, 40px); }
  .topbar { max-width: 1240px; margin: 0 auto; padding: 26px clamp(20px, 5vw, 40px); display: flex; align-items: center; justify-content: space-between; }
  .back-link { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: var(--ink-soft); transition: color .2s; }
  .back-link i { font-size: 13px; }
  [dir="rtl"] .back-link i { transform: scaleX(-1); }
  @media (hover: hover) and (pointer: fine) { .back-link:hover { color: var(--ink); } }

  .eyebrow { font-size: 13px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .eyebrow::before { content: ""; width: 24px; height: 1.5px; background: var(--accent); }

  .page-head { padding: 20px 0 36px; }
  .page-head h1 { font-size: clamp(30px, 5vw, 48px); font-weight: 800; letter-spacing: -.5px; line-height: 1.3; }
  .page-head p { margin-top: 14px; font-size: 16px; color: var(--ink-soft); font-weight: 500; }

  .cover { width: 100%; border-radius: var(--radius); display: block; margin-bottom: 40px; background: #F4F4F5; }

  .wrap.wide { max-width: 1240px; }
  .wrap.read { max-width: 900px; }

  /* Blog header */
  .blog-head { padding-bottom: 44px; }
  .blog-head h1 { font-size: clamp(40px, 7vw, 72px); line-height: 1.15; }

  /* Post grid */
  .post-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  .post-card {
    display: flex; flex-direction: column; background: #fff;
    border: 1px solid var(--line); border-radius: 18px; overflow: hidden;
    animation: rise .8s var(--ease) both; animation-delay: calc(var(--i, 0) * 80ms);
    transition: transform .5s var(--ease), box-shadow .5s var(--ease), border-color .3s;
  }
  @keyframes rise { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  .thumb { position: relative; aspect-ratio: 3 / 2; overflow: hidden; background: linear-gradient(135deg, #111214, #2b2d33); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .9s var(--ease); }
  .ph {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background-image: radial-gradient(rgba(255,255,255,.16) 1px, transparent 1px); background-size: 16px 16px;
    font-size: 130px; font-weight: 800; line-height: 1; color: rgba(255,255,255,.1);
  }
  .post-card .body { display: flex; flex-direction: column; gap: 8px; padding: 20px 22px; flex: 1; }
  .post-card h2 { font-size: 18px; font-weight: 800; line-height: 1.7; }
  .post-card .desc {
    font-size: 14px; color: var(--ink-soft); line-height: 1.9;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .post-card .foot {
    display: flex; justify-content: space-between; align-items: center;
    margin-top: auto; padding-top: 14px; font-size: 12.5px; font-weight: 700;
  }
  .post-card .go {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; transition: all .4s var(--ease);
  }
  .post-card .go i { font-size: 12px; }
  [dir="rtl"] .post-card .go i { transform: scaleX(-1); }
  @media (hover: hover) and (pointer: fine) {
    .post-card:hover { transform: translateY(-6px); border-color: var(--ink); box-shadow: 0 22px 44px rgba(17,18,20,.1); }
    .post-card:hover .thumb img { transform: scale(1.08); }
    .post-card:hover .go { background: var(--ink); color: #fff; border-color: var(--ink); transform: rotate(40deg); }
  }

  /* Single post */
  .progress {
    position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--ink); z-index: 50;
    transform: scaleX(0); transform-origin: left;
  }
  [dir="rtl"] .progress { transform-origin: right; }

  .hero-wrap { padding-top: 6px; }
  .post-hero {
    position: relative; display: flex; align-items: flex-end; overflow: hidden; color: #fff;
    min-height: clamp(300px, 36vw, 420px); border-radius: 24px; background: #16181c;
  }
  .post-hero .bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .post-hero .ph-bg { background-image: radial-gradient(rgba(255,255,255,.12) 1px, transparent 1px); background-size: 16px 16px; }
  .post-hero .shade {
    position: absolute; inset: 0;
    background: linear-gradient(to top, rgba(8,9,11,.9) 0%, rgba(8,9,11,.58) 50%, rgba(8,9,11,.38) 100%);
  }
  .post-hero .inner { position: relative; z-index: 2; padding: clamp(24px, 4vw, 52px); max-width: 860px; }
  .post-hero h1 { font-size: clamp(30px, 4.8vw, 58px); font-weight: 800; letter-spacing: -.5px; line-height: 1.35; }
  .post-hero .lead { margin-top: 14px; font-size: clamp(15px, 1.5vw, 18px); line-height: 2; color: rgba(255,255,255,.78); font-weight: 500; }

  .read-body { padding-top: 56px; }

  .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
  .prose table { width: 100%; min-width: 420px; border-collapse: collapse; font-size: 15px; }
  .prose th, .prose td { padding: 12px 18px; text-align: start; border-bottom: 1px solid var(--line); }
  .prose th + th, .prose td + td { border-inline-start: 1px solid var(--line); }
  .prose th { background: #F4F4F5; font-weight: 800; }
  .prose tr:last-child td { border-bottom: 0; }

  /* Post layout: article + sticky sidebar */
  .post-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 64px; align-items: start; padding-top: 56px; }
  .post-layout .prose { max-width: 800px; }
  .prose h2, .prose h3 { scroll-margin-top: 28px; }
  .side { position: sticky; top: 28px; display: flex; flex-direction: column; gap: 16px; }
  .side-card { border: 1px solid var(--line); border-radius: 18px; padding: 24px; background: #fff; }
  .author { text-align: center; }
  .author .avatar { width: 92px; height: 92px; border-radius: 25%; object-fit: cover; border: 3px solid var(--line); box-shadow: 0 10px 25px rgba(0,0,0,.06); }
  .author .name { margin-top: 16px; font-size: 18px; font-weight: 800; line-height: 1.5; }
  .author .role { font-size: 13px; color: var(--ink-soft); font-weight: 500; }
  .side-socials { display: flex; justify-content: center; gap: 8px; margin: 18px 0 20px; flex-wrap: wrap; }
  .side-socials a {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center; transition: all .25s var(--ease);
  }
  .side-socials a i { font-size: 14px; }
  .btn-block {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    padding: 14px 20px; border-radius: var(--radius); background: var(--ink); color: #fff;
    font-size: 14px; font-weight: 700; font-family: inherit; border: 1px solid var(--ink); cursor: pointer;
    transition: transform .2s, background .2s, color .2s;
  }
  .btn-block:active { transform: scale(.97); }
  .btn-line { background: transparent; color: var(--ink); border-color: var(--line); }
  .toc h3 { font-size: 13px; font-weight: 800; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }
  .toc h3::before { content: ""; width: 20px; height: 1.5px; background: var(--ink); }
  .toc a {
    display: block; font-size: 13.5px; line-height: 1.8; color: var(--ink-soft); padding: 5px 14px;
    border-inline-start: 2px solid var(--line); transition: color .2s, border-color .2s;
  }
  .toc a.sub { padding-inline-start: 28px; font-size: 13px; }
  .toc a.on { color: var(--ink); border-color: var(--ink); font-weight: 700; }
  @media (hover: hover) and (pointer: fine) {
    .side-socials a:hover { background: var(--ink); color: #fff; border-color: var(--ink); }
    .btn-block:hover { transform: translateY(-2px); }
    .btn-line:hover { border-color: var(--ink); }
    .toc a:hover { color: var(--ink); }
  }
  @media (max-width: 980px) {
    .post-layout { grid-template-columns: minmax(0, 1fr); gap: 40px; padding-top: 40px; }
    .side { position: static; }
    .toc { display: none; }
  }

  .more { margin-top: 90px; }
  .more-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; }
  .more-head h2 { font-size: 26px; font-weight: 800; }
  .more-head a { display: inline-flex; align-items: center; gap: 8px; font-size: 13.5px; font-weight: 700; color: var(--ink-soft); transition: color .2s; }
  .more-head a i { font-size: 12px; }
  [dir="rtl"] .more-head a i { transform: scaleX(-1); }
  @media (hover: hover) and (pointer: fine) { .more-head a:hover { color: var(--ink); } }

  @media (max-width: 900px) { .post-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 760px) {
    .post-grid { gap: 14px; }
    .post-card h2 { font-size: 15px; }
    .post-card .body { padding: 14px; }
    .post-hero { border-radius: 18px; min-height: 300px; }
  }
  @media (max-width: 520px) { .post-grid { grid-template-columns: 1fr; } }

  /* Article body */
  .prose { font-size: 17.5px; line-height: 2.05; }
  .prose > * + * { margin-top: 1.3em; }
  .prose h2 { font-size: 26px; font-weight: 800; line-height: 1.5; margin-top: 2em; }
  .prose h2::before { content: ""; display: inline-block; width: 22px; height: 2px; background: var(--ink); margin-inline-end: 12px; vertical-align: middle; }
  .prose h3 { font-size: 20px; font-weight: 700; line-height: 1.5; margin-top: 1.8em; }
  .prose a { font-weight: 700; border-bottom: 1.5px solid var(--ink); }
  .prose img { max-width: 100%; max-height: 520px; width: auto; height: auto; border-radius: 16px; display: block; margin: 2em auto; }
  .prose blockquote { background: #F7F7F8; border-radius: 14px; border-inline-start: 3px solid var(--ink); padding: 18px 24px; color: var(--ink); font-weight: 600; }
  .prose ul, .prose ol { padding-inline-start: 1.4em; }
  .prose li + li { margin-top: .4em; }
  .prose hr { border: 0; height: 1px; background: var(--line); margin: 2.4em 0; }
  .prose code { font-family: ui-monospace, Menlo, monospace; font-size: .88em; background: #F4F4F5; padding: 2px 7px; border-radius: 6px; direction: ltr; unicode-bidi: embed; }
  .prose pre { background: var(--ink); color: #fff; padding: 20px; border-radius: var(--radius); overflow-x: auto; direction: ltr; text-align: left; white-space: pre-wrap; word-break: break-word; }
  .prose pre code { background: none; padding: 0; color: inherit; }

  .post-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin: 70px 0 100px; }
  .post-nav a {
    border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px;
    font-size: 14px; font-weight: 700; transition: border-color .2s;
  }
  .post-nav small { display: block; font-size: 12px; font-weight: 600; color: var(--ink-faint); margin-bottom: 4px; }
  .post-nav .next { text-align: start; }
  .post-nav .prev { grid-column: 2; text-align: end; }
  @media (hover: hover) and (pointer: fine) { .post-nav a:hover { border-color: var(--ink); } }
  .empty { padding: 40px 0 100px; color: var(--ink-soft); }
  .list-end { height: 100px; }


  @media (max-width: 620px) { .post-nav { grid-template-columns: 1fr; } .post-nav .prev { grid-column: 1; } }
</style>
</head>
<body>

<div class="topbar{% if page.wide %} wide{% endif %}">
  <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> بازگشت به پرتفولیو</a>
  {% if page.layout == 'post' %}<a href="/blog/" class="back-link">همهٔ مطالب</a>{% endif %}
</div>

{{ content }}

</body>
</html>
