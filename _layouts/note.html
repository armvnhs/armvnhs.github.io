<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>{{ page.title | escape }} &mdash; Notes</title>
  <meta name="description" content="{{ page.subtitle | default: page.title | escape }}">
  <meta name="theme-color" content="#246BFF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/assets/site.css">
  <link rel="icon" type="image/png" href="/assets/img/site/Icon.png">
  <style>
    :root { --ink: #0A0A0A; --soft: #6F6F73; --fill: #F1F3F2; --accent: #2A6B5C; --accent-dark: #235A4D; --tint: #E6F0ED; --bg: #FBFCFB; --line: rgba(10,10,10,.1); --ease: cubic-bezier(.22, 1, .36, 1); }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    ::selection { background: var(--accent); color: #fff; }
    html { scroll-behavior: smooth; scrollbar-width: none; }
    ::-webkit-scrollbar { display: none; }
    body { font-family: Archivo, Vazirmatn, sans-serif; background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; line-height: 1.6; }
    a { color: inherit; text-decoration: none; }
    a:focus-visible, button:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    [hidden] { display: none !important; }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 0 24px; }
    .read { max-width: 792px; }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }

    .progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: var(--accent); transform: scaleX(0); transform-origin: left; z-index: 60; }

    .bar { position: sticky; top: 0; z-index: 30; background: var(--bg); border-bottom: 1px solid transparent; transition: border-color .3s; }
    .bar.stuck { border-color: var(--line); }
    .bar-in { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: calc(14px + env(safe-area-inset-top)); padding-bottom: 14px; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 16px; font-weight: 600; letter-spacing: -.02em; }
    .mark { width: 40px; height: 40px; border-radius: 13px; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; letter-spacing: 0; }
    .btn { display: inline-flex; align-items: center; gap: 8px; height: 42px; padding: 0 18px; border-radius: 13px; border: 1px solid var(--line); background: #fff; font: 600 13.5px/1 Archivo, Vazirmatn, sans-serif; transition: border-color .25s, transform .25s var(--ease); touch-action: manipulation; }
    .btn .ti { font-size: 17px; }
    .btn:active { transform: scale(.97); }
    @media (hover: hover) and (pointer: fine) { .btn:hover { border-color: var(--ink); } }

    .a-head { padding: 64px 0 8px; }
    .chip { display: inline-block; padding: 7px 15px; border-radius: 999px; background: var(--tint); color: var(--accent); font-size: 13px; font-weight: 600; }
    h1 { margin-top: 22px; font-size: clamp(34px, 6.4vw, 56px); font-weight: 500; letter-spacing: -.035em; line-height: 1.2; overflow-wrap: anywhere; }
    .summary { margin-top: 20px; max-width: 640px; font-size: 20px; line-height: 1.8; color: var(--soft); }
    .meta { display: flex; align-items: center; gap: 10px; margin-top: 26px; padding-bottom: 28px; border-bottom: 1px solid var(--line); font-size: 14px; color: var(--soft); }
    .meta .ti { font-size: 18px; }
    .cover { display: block; width: 100%; max-height: 480px; object-fit: cover; border-radius: 28px; margin: 36px 0 8px; background: var(--fill); }

    .body { margin-top: 36px; font-size: 18px; line-height: 2; overflow-wrap: anywhere; }
    .body p { margin: 0 0 24px; white-space: pre-wrap; }
    .body h1, .body h2, .body h3, .body h4, .body h5, .body h6 { margin: 44px 0 16px; line-height: 1.5; font-weight: 500; letter-spacing: -.02em; }
    .body h2 { font-size: 30px; }
    .body h3 { font-size: 23px; }
    .body img { max-width: 100%; height: auto; border-radius: 20px; margin: 8px 0; }
    .body a { color: var(--accent); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1.5px; }
    .body ul, .body ol { padding-inline-start: 28px; margin-bottom: 24px; }
    .body li { margin-bottom: 6px; }
    .body li::marker { color: var(--accent); }
    .body blockquote { margin: 28px 0; padding: 20px 26px; border-inline-start: 3px solid var(--accent); border-radius: 4px 18px 18px 4px; background: var(--tint); font-size: 19px; }
    .body blockquote p:last-child { margin-bottom: 0; }
    .body pre { overflow-x: auto; margin: 24px 0; padding: 20px; background: var(--ink); color: #f2f2f3; border-radius: 18px; direction: ltr; text-align: left; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 14px; line-height: 1.7; }
    .body code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .9em; background: var(--fill); padding: .14em .4em; border-radius: 6px; direction: ltr; }
    .body pre code { background: transparent; padding: 0; color: inherit; }
    .body table { display: block; width: 100%; max-width: 100%; overflow-x: auto; margin: 24px 0; border: 1px solid var(--line); border-radius: 16px; border-collapse: separate; border-spacing: 0; font-size: 16px; }
    .body th, .body td { padding: 12px 18px; text-align: start; border-bottom: 1px solid var(--line); }
    .body th + th, .body td + td { border-inline-start: 1px solid var(--line); }
    .body tr:last-child td { border-bottom: 0; }
    .body th { background: var(--fill); font-weight: 600; }
    .status { padding: 80px 0; color: var(--soft); line-height: 1.8; }

    .foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 72px; padding: 24px 0 calc(40px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); font-size: 13.5px; color: var(--soft); }
    .foot a { display: inline-flex; align-items: center; gap: 6px; transition: color .25s; }
    .foot .ti { font-size: 16px; }
    @media (hover: hover) and (pointer: fine) { .foot a:hover { color: var(--accent); } }

    @media (max-width: 700px) {
      .wrap { padding: 0 18px; }
      .a-head { padding-top: 40px; }
      .summary { font-size: 17px; }
      .cover { border-radius: 22px; margin-top: 28px; }
      .body { font-size: 17px; margin-top: 28px; }
      .body h2 { font-size: 25px; }
      .body h3 { font-size: 20px; }
      .body blockquote { padding: 16px 18px; font-size: 17px; }
    }
  </style>
  <style>
    :root { --bg:#f5f8ff; --paper:#fff; --ink:#0b1736; --soft:#64708a; --line:rgba(11,23,54,.12); --accent:#246bff; --accent-dark:#124bd0; --tint:#dce8ff; --ease:cubic-bezier(.22,1,.36,1); }
    body { background: radial-gradient(circle at 88% 8%, rgba(36,107,255,.10), transparent 28rem), var(--bg); }
    .bar { display:none; }
    .wrap { max-width: 960px; padding-inline: 30px; }
    .read { max-width: 860px; }
    .progress { height:4px; background:var(--accent); box-shadow:0 0 16px rgba(36,107,255,.45); }
    .a-head { padding:72px 0 26px; }
    .a-head::before { content:'Notes / Journal'; display:block; margin-bottom:28px; color:var(--accent); font-size:11px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; }
    .back-link { display:inline-flex; align-items:center; gap:8px; margin-bottom:24px; padding:9px 15px; border:1px solid var(--line); border-radius:999px; color:var(--soft); font-size:13px; transition:all .25s; }
    .back-link:hover { background:var(--accent); color:#fff; border-color:var(--accent); transform:translateX(-3px); }
    .chip { background:var(--tint); color:var(--accent); padding:8px 14px; }
    h1 { max-width:760px; margin-top:24px; font-size:clamp(42px,7vw,78px); line-height:.98; font-weight:600; letter-spacing:-.065em; }
    .summary { max-width:650px; margin-top:24px; font-size:clamp(18px,2.2vw,23px); line-height:1.55; color:var(--soft); }
    .meta { margin-top:30px; padding-bottom:24px; color:var(--soft); }
    .meta .ti { color:var(--accent); }
    .cover { max-height:560px; margin:24px 0 0; border-radius:28px; box-shadow:0 22px 65px rgba(36,107,255,.15); }
    .body { max-width:730px; margin:48px auto 0; font-size:19px; line-height:1.95; }
    .body h2,.body h3 { color:var(--ink); font-weight:650; }
    .body a { color:var(--accent); }
    .body blockquote { background:var(--tint); border-inline-start-color:var(--accent); }
    .body code { background:var(--tint); color:var(--ink); }
    .body th { background:var(--tint); }
    .body pre { background:#0b1736; box-shadow:0 14px 32px rgba(11,23,54,.14); }
    .foot { margin-top:100px; }
    .foot a:hover { color:var(--accent); }
    @media (max-width:700px) { .wrap { padding-inline:18px; } .a-head { padding-top:48px; } h1 { font-size:clamp(42px,13vw,68px); } .body { font-size:17px; margin-top:34px; } .cover { border-radius:20px; } }
  </style>
</head>
<body>
  <div class="progress" id="progress"></div>
  <main class="wrap read">
    <p id="status" class="status" role="status">Loading article&hellip;</p>
    <article id="article" hidden aria-labelledby="title">
      <header class="a-head">
        <a class="back-link" href="/#notes"><i class="ti ti-arrow-left" aria-hidden="true"></i> All notes</a>
        {% if page.category %}<span class="chip" dir="auto">{{ page.category | escape }}</span>{% endif %}
        <h1 id="title" dir="auto"></h1>
        <p id="summary" class="summary" dir="auto" hidden></p>
        <div class="meta"><i class="ti ti-clock" aria-hidden="true"></i><span id="readTime"></span></div>
      </header>
      <img id="cover" class="cover" alt="" hidden>
      <div id="body" class="body" dir="auto"></div>
    </article>
    <footer class="foot">
      <span>&copy; <span id="year"></span> <span id="footName">Arman Haghshenas</span></span>
      <a href="#top">Back to top <i class="ti ti-arrow-up" aria-hidden="true"></i></a>
    </footer>
  </main>

  <script src="/assets/blog.js"></script>
  <script id="post-data" type="application/json">
  {
    "title": {{ page.title | jsonify | replace: '<', '\u003c' }},
    "subtitle": {{ page.subtitle | default: "" | jsonify | replace: '<', '\u003c' }},
    "image": {{ page.image | default: "" | jsonify | replace: '<', '\u003c' }},
    "body": {{ content | jsonify | replace: '<', '\u003c' }},
    "bodyFormat": "html"
  }
  </script>
  <script src="/assets/article.js"></script>
  <script>
    try {
      showArticle(JSON.parse(document.getElementById('post-data').textContent));
      const words = document.getElementById('body').textContent.trim().split(/\s+/).filter(Boolean).length;
      document.getElementById('readTime').textContent = Math.max(1, Math.round(words / 200)) + ' min read';
    } catch (error) {
      document.getElementById('status').textContent = 'The article could not be loaded.';
      console.error(error);
    }

    document.getElementById('year').textContent = new Date().getFullYear();

    const bar = document.getElementById('bar');
    const progress = document.getElementById('progress');
    function onScroll() {
      if (bar) bar.classList.toggle('stuck', scrollY > 8);
      const max = document.documentElement.scrollHeight - innerHeight;
      progress.style.transform = 'scaleX(' + (max > 0 ? Math.min(1, scrollY / max) : 0) + ')';
    }
    addEventListener('scroll', onScroll, { passive: true });
    onScroll();

    fetch('/data/site.json', { cache: 'no-cache' })
      .then((r) => (r.ok ? r.json() : null))
      .then((site) => {
        if (!site) return;
        if (typeof site.name === 'string' && site.name.trim()) {
          document.getElementById('footName').textContent = site.name;
        }
      })
      .catch(() => {});
  </script>
</body>
</html>
